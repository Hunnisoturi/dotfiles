background {
  monitor =
  path = screenshot
  blur_passes = 3
  blur_size = 8
  noise = 0.0117
  contrast = 0.8916
  brightness = 0.8172
  vibrancy = 0.1696
  vibrancy_darkness = 0.0
}

label {
  monitor =
  text = cmd[update:1000] echo "$TIME"
  color = rgba(255, 255, 255, 0.8)
  font_size = 120
  font_family = JetBrains Mono Bold
  position = 0, 150
  halign = center
  valign = center
  shadow_passes = 2
}

input-field {
  monitor =
  size = 250, 60
  outline_thickness = 2
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = rgba(51, 204, 255, 1.0)
  inner_color = rgba(26, 27, 38, 0.85)
  font_color = rgba(255, 255, 255, 0.85)
  fade_on_empty = false
  placeholder_text = <i>Input Password...</i>
  hide_input = false
  position = 0, -50
  halign = center
  valign = center
}
